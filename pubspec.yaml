name: la_rivera_celdas
description: "AgroSoft J&L - Módulo de Empaque"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  camera: ^0.11.0
  intl: ^0.19.0
  http: ^1.1.0
  shared_preferences: ^2.2.2
  excel: ^4.0.0
  path_provider: ^2.1.0
  share_plus: ^7.1.0
  flutter_secure_storage: ^9.0.0
  image_picker: ^1.0.7
  device_info_plus: ^12.4.0
  supabase_flutter: ^2.8.1
  sqflite: ^2.4.1
  path: ^1.9.1
  mobile_scanner: ^5.2.0
  google_maps_flutter: ^2.12.1
  geolocator: ^13.0.1
  permission_handler: ^11.3.1
  barcode: ^2.2.6
  fl_chart: ^0.70.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/logo_agrosoft.png"
  min_sdk_android: 21
  adaptive_icon_background: "#F5F5F7"
  adaptive_icon_foreground: "assets/logo_agrosoft.png"

flutter:
  uses-material-design: true

  assets:
    - assets/